name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - local
          - cloud
      dry_run:
        description: 'Dry run (helm template only)'
        required: false
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Helm template (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: |
          helm template ap infra/charts/agent-platform \
            -f infra/charts/agent-platform/values-${{ github.event.inputs.environment }}.yaml \
            --namespace agent-platform

      - name: Helm upgrade/install
        if: github.event.inputs.dry_run == 'false'
        run: |
          helm upgrade --install ap infra/charts/agent-platform \
            -f infra/charts/agent-platform/values-${{ github.event.inputs.environment }}.yaml \
            --namespace agent-platform \
            --create-namespace \
            --wait --timeout 600s

      - name: Verify deployment
        if: github.event.inputs.dry_run == 'false'
        run: |
          kubectl get pods -n agent-platform
          kubectl get svc -n agent-platform
