# Local development values (Kubeadm + RTX 3060 12GB)

sillytavern:
  enabled: true
  image:
    repository: agent-platform/sillytavern
    tag: latest
    pullPolicy: Never
  config:
    listen: true
    whitelistMode: false

mcpGateway:
  enabled: true
  image:
    repository: agent-platform/mcp-gateway
    tag: latest
    pullPolicy: Never

agentOrchestrator:
  enabled: true
  image:
    repository: agent-platform/agent-orchestrator
    tag: latest
    pullPolicy: Never

comfyui:
  enabled: true
  image:
    repository: agent-platform/comfyui
    tag: latest
    pullPolicy: Never
  resources:
    requests:
      cpu: 1000m
      memory: 16Gi
    limits:
      cpu: 4000m
      memory: 32Gi
      nvidia.com/gpu: 1
  easywan22:
    enabled: true

redis:
  enabled: true

gpuOperator:
  enabled: true

doppler:
  enabled: true
  config: dev

nim:
  enabled: false

monitoring:
  enabled: true

openclaw:
  enabled: false
