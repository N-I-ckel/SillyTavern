{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-comfyui
  labels:
    app.kubernetes.io/name: comfyui
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: comfyui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: comfyui
    spec:
      {{- if .Values.gpu.enabled }}
      runtimeClassName: nvidia
      {{- end }}
      initContainers:
        {{- if .Values.easywan22.enabled }}
        - name: model-downloader
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "/app/scripts/download_models.py"]
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: HF_TOKEN
                  optional: true
            - name: CIVITAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: CIVITAI_API_KEY
                  optional: true
            - name: MODEL_DIR
              value: /models
          volumeMounts:
            - name: model-storage
              mountPath: /models
        {{- end }}
      containers:
        - name: comfyui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          env:
            - name: COMFYUI_PORT
              value: {{ .Values.port | quote }}
            - name: COMFYUI_LISTEN
              value: "0.0.0.0"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 60
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: model-storage
              mountPath: /app/ComfyUI/models
            - name: output
              mountPath: /app/ComfyUI/output
            - name: input
              mountPath: /app/ComfyUI/input
            {{- if .Values.easywan22.enabled }}
            - name: workflows
              mountPath: {{ .Values.easywan22.workflowMountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-comfyui-models
        - name: output
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-comfyui-output
        - name: input
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-comfyui-input
        {{- if .Values.easywan22.enabled }}
        - name: workflows
          configMap:
            name: {{ .Release.Name }}-comfyui-workflows
        {{- end }}
{{- end }}
