{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sillytavern
  labels:
    app.kubernetes.io/name: sillytavern
    {{- include "agent-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sillytavern
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sillytavern
    spec:
      containers:
        - name: sillytavern
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          env:
            - name: SILLYTAVERN_PORT
              value: {{ .Values.port | quote }}
            - name: SILLYTAVERN_LISTEN
              value: "true"
            - name: SILLYTAVERN_WHITELIST_MODE
              value: {{ .Values.config.whitelistMode | quote }}
            - name: SILLYTAVERN_ENABLE_USER_ACCOUNTS
              value: {{ .Values.config.enableUserAccounts | quote }}
            - name: SILLYTAVERN_ENABLE_CORS_PROXY
              value: {{ .Values.config.enableCorsProxy | quote }}
          envFrom:
            - secretRef:
                name: app-secrets
                optional: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-sillytavern-data
{{- end }}
