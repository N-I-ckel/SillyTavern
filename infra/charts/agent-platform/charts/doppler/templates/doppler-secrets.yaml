{{- if .Values.enabled }}
# Doppler Operator manages secrets sync from Doppler SaaS to K8s Secrets.
# Prerequisites:
#   helm repo add doppler https://helm.doppler.com
#   helm install doppler-operator doppler/doppler-kubernetes-operator \
#     --namespace doppler-system --create-namespace

# Service token for Doppler API access
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tokenSecretName }}
  labels:
    app.kubernetes.io/name: doppler
type: Opaque
data: {}
  # serviceToken: <base64-encoded Doppler service token>
  # Set via: kubectl create secret generic {{ .Values.tokenSecretName }} \
  #   --from-literal=serviceToken=dp.st.xxx

---
# DopplerSecret CRD — auto-syncs Doppler project secrets to a K8s Secret
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: {{ .Release.Name }}-app-secrets
  labels:
    app.kubernetes.io/name: doppler
spec:
  tokenSecret:
    name: {{ .Values.tokenSecretName }}
  managedSecret:
    name: app-secrets
    namespace: {{ .Release.Namespace }}
  resyncSeconds: {{ .Values.syncInterval | default 60 | int }}
  project: {{ .Values.project }}
  config: {{ .Values.config }}

{{- range .Values.managedSecrets }}
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    app.kubernetes.io/name: doppler
spec:
  tokenSecret:
    name: {{ $.Values.tokenSecretName }}
  managedSecret:
    name: {{ .name }}
    namespace: {{ $.Release.Namespace }}
  resyncSeconds: {{ $.Values.syncInterval | default 60 | int }}
  project: {{ $.Values.project }}
  config: {{ $.Values.config }}
{{- end }}
{{- end }}
