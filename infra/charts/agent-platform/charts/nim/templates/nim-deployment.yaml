{{- if .Values.enabled }}
{{- if .Values.llm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nim-llm
  labels:
    app.kubernetes.io/name: nim-llm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nim-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nim-llm
    spec:
      runtimeClassName: nvidia
      containers:
        - name: nim-llm
          image: "{{ .Values.llm.image.repository }}:{{ .Values.llm.image.tag }}"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: NGC_API_KEY
                  optional: true
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /v1/health/ready
              port: http
            failureThreshold: 120
            periodSeconds: 10
          resources:
            {{- toYaml .Values.llm.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nim-llm
  labels:
    app.kubernetes.io/name: nim-llm
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: nim-llm
{{- end }}
{{- end }}
