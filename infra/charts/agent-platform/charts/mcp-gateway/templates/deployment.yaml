{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-gateway
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gateway
    spec:
      containers:
        - name: mcp-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          env:
            - name: MCP_GATEWAY_PORT
              value: {{ .Values.port | quote }}
            - name: SILLYTAVERN_URL
              value: "http://{{ .Release.Name }}-sillytavern:{{ .Values.global.sillytavern.port | default 8000 }}"
            - name: COMFYUI_URL
              value: "http://{{ .Release.Name }}-comfyui:{{ .Values.global.comfyui.port | default 8188 }}"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
