{{- if .Values.enabled }}
# kube-prometheus-stack is deployed via its official Helm chart.
# This ConfigMap stores the install instructions for reference and automation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-monitoring-install
  labels:
    app.kubernetes.io/name: monitoring
data:
  install.sh: |
    #!/bin/bash
    set -euo pipefail

    # Prometheus + Grafana
    helm repo add prometheus-community https://prometheus-community.github.io/helm-charts || true
    helm repo update
    helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
      --namespace monitoring --create-namespace \
      --set prometheus.prometheusSpec.retention={{ .Values.prometheus.retention | default "15d" }} \
      --set grafana.enabled={{ .Values.grafana.enabled }} \
      {{- if .Values.grafana.adminPassword }}
      --set grafana.adminPassword={{ .Values.grafana.adminPassword }} \
      {{- end }}
      --wait --timeout 600s

    # Loki (log aggregation)
    {{- if .Values.loki.enabled }}
    helm repo add grafana https://grafana.github.io/helm-charts || true
    helm upgrade --install loki grafana/loki-stack \
      --namespace monitoring \
      --set loki.retention_period={{ .Values.loki.retention | default "168h" }} \
      --set promtail.enabled=true \
      --wait --timeout 300s
    {{- end }}

---
{{- if .Values.prometheus.enabled }}
# ServiceMonitor for agent-platform services
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-services
  labels:
    app.kubernetes.io/name: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: agent-platform
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}

---
{{- if .Values.dcgm.enabled }}
# DCGM Exporter is auto-managed by GPU Operator when enabled.
# This ServiceMonitor ensures Prometheus scrapes DCGM metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-dcgm
  namespace: gpu-operator
  labels:
    app.kubernetes.io/name: dcgm-exporter
spec:
  selector:
    matchLabels:
      app: nvidia-dcgm-exporter
  endpoints:
    - port: gpu-metrics
      interval: 15s
{{- end }}
{{- end }}
