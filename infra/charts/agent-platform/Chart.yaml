apiVersion: v2
name: agent-platform
description: Unified AI Agent Platform — SillyTavern + ComfyUI + EasyWan22 + MCP
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: sillytavern
    version: 0.1.0
    condition: sillytavern.enabled
  - name: mcp-gateway
    version: 0.1.0
    condition: mcpGateway.enabled
  - name: comfyui
    version: 0.1.0
    condition: comfyui.enabled
  - name: redis
    version: 0.1.0
    condition: redis.enabled
  - name: gpu-operator
    version: 0.1.0
    condition: gpuOperator.enabled
  - name: doppler
    version: 0.1.0
    condition: doppler.enabled
  - name: nim
    version: 0.1.0
    condition: nim.enabled
  - name: monitoring
    version: 0.1.0
    condition: monitoring.enabled
  - name: openclaw
    version: 0.1.0
    condition: openclaw.enabled
