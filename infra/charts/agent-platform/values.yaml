# ===== Unified AI Agent Platform — Default Values =====
# Zero hardcoding: all config via this file, env overrides, or Doppler secrets

# ===== Core Services =====

sillytavern:
  enabled: true
  image:
    repository: ghcr.io/agent-platform/sillytavern
    tag: latest
    pullPolicy: IfNotPresent
  port: 8000
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  config:
    listen: true
    whitelistMode: false
    enableUserAccounts: false
    enableCorsProxy: true
    basicAuthMode: false

mcpGateway:
  enabled: true
  image:
    repository: ghcr.io/agent-platform/mcp-gateway
    tag: latest
    pullPolicy: IfNotPresent
  port: 3100
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

agentOrchestrator:
  enabled: true
  image:
    repository: ghcr.io/agent-platform/agent-orchestrator
    tag: latest
    pullPolicy: IfNotPresent
  port: 3200
  replicaCount: 1
  maxAgents: 10
  timeoutMs: 30000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

comfyui:
  enabled: false
  image:
    repository: ghcr.io/agent-platform/comfyui
    tag: latest
    pullPolicy: IfNotPresent
  port: 8188
  replicaCount: 1
  resources:
    requests:
      cpu: 1000m
      memory: 16Gi
    limits:
      cpu: 4000m
      memory: 32Gi
      nvidia.com/gpu: 1
  gpu:
    enabled: true
    count: 1
  easywan22:
    enabled: true
    pythonVersion: "3.10.6"
    pytorch:
      version: "2.7.1"
      cudaVersion: "12.8"
    modelStorage:
      size: 100Gi
      storageClass: ""
    workflowMountPath: /app/ComfyUI/user/default/workflows
    customNodes:
      - https://github.com/kijai/ComfyUI-WanVideoWrapper
      - https://github.com/kijai/ComfyUI-KJNodes
      - https://github.com/kijai/ComfyUI-Florence2
      - https://github.com/kijai/ComfyUI-DepthAnythingV2
      - https://github.com/Fannovel16/ComfyUI-Frame-Interpolation
      - https://github.com/ltdrdata/ComfyUI-Impact-Pack
      - https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite
      - https://github.com/kijai/ComfyUI-segment-anything-2
      - https://github.com/BRIA-AI/ComfyUI-BRIA-RMBG
      - https://github.com/city96/ComfyUI-GGUF
    models:
      diffusionModels:
        - Wan-AI/Wan2.1-I2V-14B-720P
      textEncoders:
        - Comfy-Org/Wan_2.1_ComfyUI_repackaged
      vae:
        - Wan-AI/Wan2.1
      clipVision:
        - openai/clip-vit-large-patch14

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# ===== NVIDIA Stack =====

gpuOperator:
  enabled: true
  version: v26.3.0

nim:
  enabled: false
  llm:
    enabled: false
    image:
      repository: nvcr.io/nim/meta/llama-3.1-8b-instruct
      tag: latest
    gpu:
      count: 1
    resources:
      requests:
        cpu: 4000m
        memory: 16Gi
      limits:
        cpu: 8000m
        memory: 32Gi
        nvidia.com/gpu: 1

# ===== Secrets Management =====

doppler:
  enabled: true
  project: agent-platform
  config: dev
  tokenSecretName: doppler-token
  syncInterval: 60
  managedSecrets:
    - name: app-secrets
      keys:
        - HF_TOKEN
        - CIVITAI_API_KEY
        - OPENAI_API_KEY
        - ANTHROPIC_API_KEY

# ===== Monitoring =====

monitoring:
  enabled: true
  prometheus:
    enabled: true
    retention: 15d
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
  grafana:
    enabled: true
    adminPassword: ""  # Set via Doppler
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  loki:
    enabled: true
    retention: 168h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  dcgm:
    enabled: true

# ===== Agent Sandbox =====

openclaw:
  enabled: false
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: latest
  sandbox:
    mode: all
    scope: session
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
